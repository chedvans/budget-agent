# עיצוב הממשק: מצב בהיר קבוע וצבע מוביל.
# בלי הקובץ הזה Streamlit עובר למצב כהה אצל מי שהמחשב שלו מוגדר כך, והעיצוב נשבר.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F7F9"
textColor = "#1F2937"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
